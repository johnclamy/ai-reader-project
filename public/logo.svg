<svg xmlns="http://w3.org" viewBox="0 0 200 300" width="100%" height="100%">
  <!-- Main Bookmark Base Body -->
  <rect x="50" y="40" width="100" height="220" rx="10" fill="#C85A32" />
  
  <!-- Geometric Fox Ears -->
  <polygon points="50,40 50,10 85,40" fill="#C85A32" />
  <polygon points="150,40 150,10 115,40" fill="#C85A32" />
  
  <!-- Cozy Glasses (Knitted/Wire Style Silhouette) -->
  <circle cx="80" cy="85" r="18" stroke="#FFFFFF" stroke-width="4" fill="none" />
  <circle cx="120" cy="85" r="18" stroke="#FFFFFF" stroke-width="4" fill="none" />
  <line x1="98" y1="85" x2="102" y2="85" stroke="#FFFFFF" stroke-width="4" />
  <path d="M 58,85 Q 52,82 50,75" stroke="#FFFFFF" stroke-width="3" fill="none" />
  <path d="M 142,85 Q 148,82 150,75" stroke="#FFFFFF" stroke-width="3" fill="none" />

  <!-- Sleeping/Content Eyes inside the glasses -->
  <path d="M 72,85 Q 80,91 88,85" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" />
  <path d="M 112,85 Q 120,91 128,85" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" />

  <!-- Geometric Snout -->
  <polygon points="93,105 107,105 100,113" fill="#FFFFFF" />

  <!-- Minimalist Book Template Silhouette at the bottom -->
  <path d="M 70,220 Q 100,210 130,220 L 130,240 Q 100,230 70,240 Z" fill="#FFFFFF" opacity="0.3" />
</svg>

